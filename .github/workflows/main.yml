name: Vulnerability Scan and Testbench

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  vulnerability_scan:
    name: Vulnerability Scan
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Scan source for Vulnerabilities (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-package: -mode=source -show verbose ./
          repo-checkout: true
          # we need to set a version here until https://github.com/golang/go/issues/70036 is fixed..
          go-version-input: ""
          go-version-file: go.mod
  run_tests:
    name: Testbench (${{ matrix.platform }})
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Run linter checks
        if: matrix.platform == 'linux/amd64'
        run: make lint
      - name: Build shared object
        run: make performanceBuild PLATFORM=${{ matrix.platform }}
      - name: Build test envoy image
        run: make buildTestEnvoy PLATFORM=${{ matrix.platform }}
      - name: Run FTW tests
        if: matrix.platform == 'linux/amd64'
        run: make ftw
      - name: Run e2e tests
        if: matrix.platform == 'linux/amd64'
        run: make e2e
